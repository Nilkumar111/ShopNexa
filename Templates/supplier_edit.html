{% extends 'base.html' %}{% block title %}Edit Product — ShopNexa{% endblock %}{% block content %}<div class="wrap narrow"><div class="panel"><h1>Edit Product</h1><p class="muted">Changes require admin re-approval.</p><form class="form" method="post"><input name="name" value="{{product.name}}" required><input name="category" value="{{product.category}}" required><textarea name="description">{{product.description or ''}}</textarea><div class="two"><input type="number" step="0.01" name="supplier_price" value="{{product.supplier_price}}" required><input type="number" step="0.01" name="selling_price" value="{{product.selling_price}}" required></div><input type="number" min="0" name="stock" value="{{product.stock}}" required><button class="btn orange big">Save Changes</button><a class="btn light" href="/supplier">Cancel</a></form></div></div>{% endblock %}
